name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest --cov=vault_migration --cov-report=term-missing
  real-vault:
    # Runs the whole flow against a real Vault dev server (KV v2, real CAS semantics).
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.17
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: --cap-add=IPC_LOCK
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: dev-root-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e .
      - run: vault-migrate demo --out demo
      - run: |
          A="--source demo/legacy.json --rules demo/rules.yml --state state --backend http"
          vault-migrate apply $A --execute --create-mounts
          vault-migrate apply $A --execute        # idempotent: all skipped
          vault-migrate verify $A
      - name: examples/ with the minimal migration policy (non-root token)
        run: |
          # Same policy and rules as examples/, under an ex- prefix so they do not collide with the demo mounts.
          sed 's/kv-/ex-/g' examples/vault/migration-policy.hcl > ex-policy.hcl
          sed 's/^mount_prefix: kv-/mount_prefix: ex-/' examples/rules.yml > ex-rules.yml
          jq -n --rawfile p ex-policy.hcl '{policy: $p}' |
            curl -sf -X PUT -H "X-Vault-Token: $VAULT_TOKEN" --data @- "$VAULT_ADDR/v1/sys/policies/acl/vault-migration"
          export VAULT_TOKEN=$(curl -sf -X POST -H "X-Vault-Token: $VAULT_TOKEN" \
            -d '{"policies":["vault-migration"],"ttl":"15m"}' "$VAULT_ADDR/v1/auth/token/create" | jq -r .auth.client_token)
          A="--source examples/legacy.json --rules ex-rules.yml --state ex-state --backend http"
          vault-migrate apply $A --execute --create-mounts
          vault-migrate apply $A --execute
          vault-migrate verify $A
